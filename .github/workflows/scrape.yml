name: scrape

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours — picks the next unscraped providers
  workflow_dispatch:
    inputs:
      provider:
        description: "Force a specific provider slug (leave blank to auto-pick next)"
        required: false
        default: ""
      exam:
        description: "Single exam slug (optional)"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Camoufox browser (fallback for blocked pages)
        run: python -m camoufox fetch

      - name: Install Playwright Firefox
        run: python -m playwright install firefox --with-deps

      - name: Configure git for incremental commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pick next providers and scrape
        run: |
          PROVIDER="${{ github.event.inputs.provider }}"
          EXAM="${{ github.event.inputs.exam }}"

          # Manual single-provider override
          if [ -n "$PROVIDER" ]; then
            echo "Scraping provider: $PROVIDER"
            if [ -n "$EXAM" ]; then
              python scrape.py --provider "$PROVIDER" --exam "$EXAM" --commit
            else
              python scrape.py --provider "$PROVIDER" --commit
            fi
            exit 0
          fi

          # Auto-pick up to 3 unscraped providers from providers.txt
          COUNT=0
          while IFS= read -r line; do
            [[ "$line" =~ ^#.*$ || -z "$line" ]] && continue
            provider="$line"
            if [ ! -d "data/$provider" ] || [ -z "$(ls -A data/$provider 2>/dev/null)" ]; then
              echo "Scraping provider: $provider"
              python scrape.py --provider "$provider" --commit
              COUNT=$((COUNT + 1))
              if [ "$COUNT" -ge 3 ]; then
                break
              fi
            fi
          done < providers.txt

          if [ "$COUNT" -eq 0 ]; then
            echo "All providers already scraped. Nothing to do."
          fi
