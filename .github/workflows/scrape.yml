name: scrape

on:
  schedule:
    - cron: "0 * * * *"   # every 1 hour — picks the next unscraped provider
  workflow_dispatch:
    inputs:
      provider:
        description: "Force a specific provider slug (leave blank to auto-pick next)"
        required: false
        default: ""
      exam:
        description: "Single exam slug (optional)"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Camoufox browser (fallback for blocked pages)
        run: python -m camoufox fetch

      - name: Install Playwright Firefox
        run: python -m playwright install firefox --with-deps

      - name: Configure git for incremental commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pick next provider and scrape
        run: |
          PROVIDER="${{ github.event.inputs.provider }}"
          EXAM="${{ github.event.inputs.exam }}"

          if [ -z "$PROVIDER" ]; then
            # Auto-pick: first provider in providers.txt with no data yet
            while IFS= read -r line; do
              [[ "$line" =~ ^#.*$ || -z "$line" ]] && continue
              provider="$line"
              if [ ! -d "data/$provider" ] || [ -z "$(ls -A data/$provider 2>/dev/null)" ]; then
                PROVIDER="$provider"
                break
              fi
            done < providers.txt
          fi

          if [ -z "$PROVIDER" ]; then
            echo "All providers already scraped. Nothing to do."
            exit 0
          fi

          echo "Scraping provider: $PROVIDER"

          if [ -n "$EXAM" ]; then
            python scrape.py --provider "$PROVIDER" --exam "$EXAM" --commit
          else
            python scrape.py --provider "$PROVIDER" --commit
          fi
